name: Bug report
description: Report incorrect, unsafe, or irreproducible behavior
title: "[Bug]: "
body:
  - type: textarea
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Operating system, Python version, commit or release, and relevant seed.
  - type: checkboxes
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, personal data, and private datasets.
          required: true
