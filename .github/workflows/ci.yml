name: verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run dependency-light verification
        run: >-
          python -m pytest -q -m "not neural"
          tests/test_gum_studio.py
          tests/test_gum_harness.py
          tests/test_concept_genesis.py
          tests/test_concept_skill_factory.py
          tests/test_data_rescue_world.py
          tests/test_meta_learning.py
          tests/test_clarification_challenge.py
          tests/test_teaching_lab.py
          tests/test_reveal_gate.py
          tests/test_dual_reveal_gate.py

  full:
    name: Full suite with neural extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,neural]"
      - run: python -m pytest -q
      - name: Run secured Studio smoke test
        run: python scripts/smoke_studio.py --workspace .test-temp/ci-studio --port 8876
      - name: Audit public package and label saved evidence
        run: python scripts/audit_release_integrity.py
      - name: Verify v0.2.1 release manifest
        run: python scripts/verify_freeze.py --manifest RELEASE_MANIFEST_v0.2.1.json
